- id: asphalt
  title: Asphalt
  date: 2026-10
  text: |-
    I jump off the train.
    I need to pray
    and get coffee.

    Ẓuhr and ‘Aṣr.
    Milk. No sugar.

    But there is a sweetness
    in touching the asphalt,
    no longer embarrassed
    to pray in public.

- id: the-line
  title: The Line
  date: 2026-10
  text: |-
    I wait for Jumu‘ah,
    shoes lying scattered,
    grand thoughts of changing the world.

    I look up.
    An older man has set the shoes in pairs,
    on the right side of the line.

    Ordered.

- id: birds-and-supplications
  title: Birds and Supplications
  date: 2025-12
  text: |-
    It feels empty
    to have nothing to send home.
    Nothing but birds
    and supplications.

- id: review-and-wait
  title: Review and Wait
  date: 2025-12
  text: |-
    Too much time with AI,
    too little thought of my own,
    and my mind has begun to rot.

    I can feel it in how I speak
    and in what I make.

    Mostly now, I review.
    And wait.

- id: bread
  title: Bread
  date: 2025-07
  text: |-
    He ran for bread,
    was shot instead.
    Lay still. Cold.
    Dead.

- id: swifts
  title: Swifts
  date: 2025-07
  text: |-
    Swifts
    teasing the falling dark,
    going nowhere,
    never still.

- id: a-subscription-to-peace
  title: A Subscription to Peace
  date: 2024-12
  text: |-
    It is strange
    how we tie feelings to certain objects.
    This one I connect with calm.
    I just want to hold it in my hand.

    It does not contain peace.
    It is only a feeling
    I have subscribed to.

- id: the-ivy
  title: The Ivy
  date: 2024-11
  text: |-
    It survives the winter without growing.
    Patience,
    and knowing that everything has its time.

    What does it do in winter?
    Nothing, perhaps.

    Is there something good in doing nothing?
    Being still, and resting.
    Like sleep.

- id: the-sound-of-nothing
  title: The Sound of Nothing
  date: 2024-11
  text: |-
    There is something sombre in it.
    The sound of something,
    and yet of nothing real.
    It speaks of movement, of distance,
    as much as of an engine turning.

    I have heard this sound many times.
    I know what it is,
    but not exactly.

- id: poets
  title: Poets
  date: 2024-11
  text: |-
    We recognise ourselves in poets,
    in their observations and their questions,
    but we find no answers there.

    They know as little, and as much, as we do.

- id: rhythm
  title: Rhythm
  date: 2024-11
  text: |-
    The Qur’ān is beyond comparison
    with human poetry.

    Yet reciting al-Burūj and aṭ-Ṭāriq tonight,
    I felt its rhythm more deeply,
    a dimension in its patterns
    I had never given its due.

- id: a-dark-room
  title: A Dark Room
  date: 2023-02
  text: |-
    There are feelings
    I have no rational tools for.
    It is like walking through a dark room
    full of small dangers
    that I cannot see
    and do not know how to meet.

    No enemy with a shape
    that I can face and strike,
    only something moving in the shadows,
    creeping,
    slipping in under my guard
    unnoticed.

- id: the-taxi
  title: The Taxi
  date: 2023-02
  text: |-
    I remember being small,
    so small that you are afraid
    whenever your mother is not there.

    I was so afraid the taxi would not come,
    that I would not get to go home.
    I waited, and I was afraid,
    more afraid than anyone,
    of something that was not really dangerous.
    But I missed her,
    and it was so good to come home.

    Now I am so much older,
    and I need to be strong.

- id: stay
  title: Stay
  date: 2023-02
  text: |-
    Bismillāh.

    Stay.
    Even when it is unpleasant.
    Let it wash over you,
    and teach the body
    that it is not dangerous.

    Wait for the strain to pass
    and rest to take over again.

    Alḥamdulillāh.

- id: if-it-were-easy
  title: If It Were Easy
  date: 2023-02
  text: |-
    Of course I want the trial to be over,
    for everything to be easy.
    But who do I become then?
    I lose my grip.

    Trial strengthens and sharpens.
    Can one even be strong,
    and on the right path,
    without it?

    It is so much harder
    to be a good servant
    when everything is easy.

- id: a-withered-leaf
  title: A Withered Leaf
  date: 2023-02
  text: |-
    So many thoughts lately,
    all of them turned inward.

    I almost long to potter with flowers,
    something that exists
    outside my own thinking,
    something living to turn to.

    I almost long to feel a withered leaf,
    all its dryness,
    against my fingers.

- id: a-monster-without-a-name
  title: A Monster Without a Name
  date: 2023-02
  text: |-
    When I write, I grow calm.

    What is brewing inside
    comes out:
    things I push down,
    things that would otherwise grow
    into a monster
    whose name I do not know.

- id: bilal
  title: Bilāl
  date: 2023-02
  text: |-
    When I think of how Bilāl was tortured,
    I wonder how far
    my own faith may be tested.

    How beautiful, the way he endured,
    and how great his reward.

- id: a-heart-filled-with-the-quran
  title: A Heart Filled with the Qur’ān
  date: 2023-02
  text: |-
    When I die, I want my heart
    to hold as much of the Qur’ān as it can.

- id: the-meaning-of-life
  title: The Meaning of Life
  date: 2023-01
  text: |-
    What is the point of planting a seed
    if you do not know
    there is a flower inside it?

- id: something-alive
  title: Something Alive
  date: 2021-05
  text: |-
    It feels good to water the flowers.
    Something alive, not digital,
    that asks for constant, measured care,
    attention without spoiling.

- id: not-a-silver-calla
  title: Not a Silver Calla
  date: 2020-07
  text: |-
    I thought it was a silver calla
    and put it somewhere dark.
    It did not like that.

    It turned out
    it was not a silver calla.

- id: colours-we-cannot-see
  title: Colours We Cannot See
  date: 2020-05
  text: |-
    If there are colours other animals can see
    but we cannot,
    what else has Allāh created
    that we cannot see?

- id: smallness
  title: Smallness
  date: 2019-12
  text: |-
    Greatness before people
    comes from knowing
    one’s smallness before Allāh.

- id: the-plastic-bag
  title: The Plastic Bag
  date: 2019-12
  text: |-
    Worry feels like a plastic bag
    filled with water,
    with small holes I cannot find,
    and the water keeps running out.

    Irrational.

- id: in-the-dark
  title: In the Dark
  date: 2019-11
  text: |-
    If you sin in the dark,
    it will show in the light.

- id: the-maze
  title: The Maze
  date: 2019-11
  text: |-
    It was like wandering in a maze.
    When I should have looked up,
    I only went deeper in.

- id: a-million-grains-of-sand
  title: A Million Grains of Sand
  date: 2019-01
  text: |-
    Raising children
    is a little like laying
    a million grains of sand
    in a line towards a distant mark.

    No need to panic
    if a few end up out of place.
    Stay on course.

- id: the-blinds
  title: The Blinds
  date: 2019-01
  text: |-
    In this house no one can see in,
    not even someone watching in secret.
    The one who lives here chooses
    what is shown,
    and when, and to whom.

    The cord hangs on the inside.

- id: the-pendulum
  title: The Pendulum
  date: 2018-12
  text: |-
    I have tried to reach an ideal state.
    Perhaps I should accept
    that I swing between states,
    and that this is life.

    Becoming sad is stronger than being sad.

    A life held in one ideal state
    would be a poor one.

- id: a-beam-into-the-dark
  title: A Beam into the Dark
  date: 2018-12
  text: |-
    Finding yourself
    is like letting a beam of light
    fall into a dark hole.
    You do not know what it will show.

    Then comes the harder part:
    not looking away.

- id: before-the-pupils-narrow
  title: Before the Pupils Narrow
  date: 2018-12
  text: |-
    When you step from a dark room
    into the light,
    it strikes so hard you feel it
    before the pupils have narrowed.

    Coming out of a dark time into joy,
    you feel it far more strongly
    than if you had always lived in joy.

- id: a-knot-of-thoughts
  title: A Knot of Thoughts
  date: 2018-12
  text: |-
    Thoughts, and thoughts,
    and still more thoughts,
    that have tied themselves in a knot.

    It is not a matter of intelligence.
    More of it would only pull the knot tighter.

    What loosens it
    is a pure and open heart.

- id: inner-conversations
  title: Inner Conversations
  date: 2018-12
  text: |-
    The conversations I have held
    inside myself
    with someone else
    are conversations
    I should be holding
    with Allāh.

- id: bricks
  title: Bricks
  date: 2018-11
  text: |-
    I turn inward and feel low,
    and thoughts come down on me
    like bricks.

    I want to flee from all of it.

    Allāh, save me from myself.

- id: the-same-fog
  title: The Same Fog
  date: 2018-10
  text: |-
    There is a fog that rises
    when I stop reasoning from facts
    and go straight to feeling.

    I have only known it as dark.
    But it is not always dark.
    The daydreams I enjoy
    are the same fog,
    only brighter.

    Neither shows things as they are.
    The dark fog is unfair to others.
    The bright one flatters me.

- id: every-house
  title: Every House
  date: 2018-10
  text: |-
    In every house of happiness
    there are still rooms of sorrow.

- id: you-make-the-one
  title: You Make the One
  date: 2018-10
  text: |-
    You do not find the one.
    You make the one.
    Together.

    Like a woodcarver
    who walks through the forest
    looking for good timber:
    it is still only timber
    until many shared hours
    have gone into shaping it.

- id: warmth
  title: Warmth
  date: 2018-10
  text: |-
    I see infatuation
    the way the blind see the sun’s rays.

    But deep love
    I feel the way they feel its warmth.

- id: convert
  title: Convert
  date: 2018-10
  text: |-
    Lately it has struck me
    that I no longer see myself as a convert.

    Islām is simply what is normal now,
    not something new.

- id: good-people
  title: Good People
  date: 2018-09
  text: It is not the evil who are dangerous. It is the evil deeds of the good.
  form: prose

- id: the-world-bends
  title: The World Bends
  date: 2018-08
  text: |-
    When I walk,
    the world bends,
    and I play with new shapes
    for houses, streets,
    road signs and hedges.

- id: to-vote
  title: To Vote
  date: 2018-08
  text: |-
    I find it hard to do anything I do not wholly believe in. The belief need not be religious, but it must be free of doubt. No political party today meets that standard, and so I do not vote.

    It is the same with work. I would like a job I could believe in more fully.
  form: prose

- id: for-the-people-of-today
  title: For the People of Today
  date: 2018-08
  text: |-
    Democracy may be good at solving problems that are short-term and local. People look after their own interests, and vote for the party that offers them the best answer for now.

    Democracy is for the people of today, not for the children of tomorrow.
  form: prose

- id: without-the-phone
  title: Without the Phone
  date: 2018-08
  text: |-
    A quiet Sunday.
    Not reading, not brooding,
    no pressure to make anything profound.

    How freeing, to be with my children
    without being lost in thought,
    or in the phone.

- id: a-full-stop
  title: A Full Stop
  date: 2018-07
  text: |-
    I get caught in my own thoughts.
    They go round and round
    and never reach an end.

    But when I write
    I have to put a full stop,
    and I can leave the thoughts behind.

- id: the-news
  title: The News
  date: 2018-07
  text: |-
    It was right to switch off the news.
    Strange, how much room it left inside.

    Inside, something is always turning,
    and if I do not feed it
    with what is good,
    it turns against me.

- id: to-the-surface
  title: To the Surface
  date: 2018-05
  text: |-
    A drop falls deep into a well,
    so deep, perhaps,
    it could never come up again
    had there not been someone
    to draw it up.
    To the surface of the earth.
    To reality.

- id: the-fast-as-a-shield
  title: The Fast as a Shield
  date: 2018-05
  text: |-
    Music reaches inward.
    It moves the pulse, the blood,
    the mood.

    But while I fast
    it does not reach me.

- id: walks-in-ramadan
  title: Walks in Ramaḍān
  date: 2018-05
  text: |-
    Burning calories,
    asking forgiveness.

    Turning downward,
    and inward.

- id: walking-alone
  title: Walking Alone
  date: 2018-04
  text: |-
    It was wonderful to walk alone.
    Joy came back,
    frustration fell away.
    I had time to sort through my thoughts.

    I only wanted to be alone.

- id: tent-poles
  title: Tent Poles
  date: 2018-04
  text: |-
    What a relief, when someone goes ahead
    and raises the tent poles.
    Then I have all the strength in the world
    to build what goes inside.

- id: more-sides-of-yourself
  title: More Sides of Yourself
  date: 2018-03
  text: Every side of yourself you come to know is another place where someone can meet you.
  form: prose

- id: troubled-and-downcast
  title: Troubled and Downcast
  date: 2018-03
  text: |-
    A heart that feels its own uncleanness
    is a heart with insight,
    one that can rise towards purity, in shā’ Allāh.

    The worst heart may be the one
    that seems happy and yet is dead.
    The downcast heart that lives
    is worth more.

    Perhaps not even the pure heart
    will be full of joy,
    since it sees what is to come in the next life
    and is troubled.

    Perhaps the question is
    which way the heart is turned:
    towards this life, or the next.

    Troubled and downcast,
    it may still be on the right path.

- id: house
  title: House
  date: 2018-01
  text: |-
    To walk past a house
    and see that someone already lives there,
    and to be glad
    that someone lives there and cares for it
    and shares in its warmth
    and its inner rooms,
    where no one else may enter.

    Not to want to go in.

    To walk home to your own house,
    which you may enter,
    and wander into its inner rooms
    and touch its warmth.

- id: a-human-enemy
  title: A Human Enemy
  date: 2017-11
  text: |-
    A human enemy
    can be won over by kindness.
    There is hope in people.

    But the heart of Shayṭān
    will stay hard as stone
    and never accept kindness.

- id: an-apartment-has-no-history
  title: An Apartment Has No History
  date: 2017-08
  text: |-
    There is an advantage
    to living in an apartment:
    no history,
    no nostalgia.

    In a family house
    so many old memories can gather
    that they cloud the view of the next life.

    Thoughts of where we come from,
    the wish to go back,
    can make us forget
    where we are going.

- id: presence
  title: Presence
  date: 2016-08
  text: |-
    When feeling takes over,
    we can make foolish choices.
    But without feeling,
    there is no presence.

    Feelings must always be turned
    towards what pleases Allāh.

    A heart can feel rightly,
    and a heart can feel wrongly.

- id: glasses-that-fog
  title: Glasses That Fog
  date: 2016-07
  text: |-
    After four weeks away
    you think differently,
    as if you had been given
    clear glasses to see through.

    After a while back at work
    they fog up again.

- id: after-dhikr
  title: After Dhikr
  date: 2016-02
  text: |-
    After much dhikr
    I feel at peace,
    present in what is happening.

    I need not plan so much,
    nor dream my way towards
    what I want to reach.
    Most of it comes about
    by doing it,
    now.

- id: a-word-that-moves
  title: A Word That Moves
  date: 2015-12
  text: |-
    The trouble with the word Sufism
    is that it moves.
    What was called Sufism a thousand years ago
    is not what is called Sufism today.

    The word has held the best of the religion,
    and also what leads out of it.

- id: a-sunday-afternoon-in-november
  title: A Sunday Afternoon in November
  date: 2015-11
  text: |-
    A wonderful walk with the camera
    in a light haze.

    Somehow my style was there
    without any editing.

    A calm Sunday afternoon,
    the pace turned down a little,
    time to reflect.

    So my style is that feeling:
    a Sunday afternoon in November,
    a rain-heavy day in summer.

- id: orange-falling-asleep-in-mist
  title: Orange Falling Asleep in Mist
  date: 2015-11
  text: |-
    I like the modest orange
    falling asleep in the mist.
    It is restful.

- id: sundays
  title: Sundays
  date: 2015-11
  text: |-
    I am coming to love these Sundays
    more and more.

    Not because Monday and the new week are near,
    but because the old week is so far away.

- id: close-by
  title: Close By
  date: 2015-01
  text: |-
    Our gaze is drawn instinctively
    to bright colours, bold contrasts,
    and all that places itself
    at the centre.

    But is this truly what is beautiful?

    Perhaps, if we take the time
    to look twice,
    we find beauty in what at first glance
    slipped quietly by.

    We need not climb the hilltop
    nor travel far
    to find the beautiful.
    We may discover it
    close by, right here.

- id: the-measure-of-a-journey
  title: The Measure of a Journey
  date: 2014-05
  text: |-
    A good measure
    of whether a journey is pleasing to Allāh
    is whether you would be afraid
    to die on it.

- id: pumped-tyres
  title: Pumped Tyres
  date: 2014-04
  text: |-
    Something as small
    as pumped-up tyres
    makes it so much easier
    to cycle,
    and to pray.

- id: not-loving-this-life
  title: Not Loving This Life
  date: 2013-12
  text: |-
    Sometimes I have a beautiful feeling,
    longing and faintly melancholy,
    of not loving this life.

- id: a-long-struggle
  title: A Long Struggle
  date: 2013-07
  text: |-
    This life is a long struggle.
    It does not end until we die.
    The trials go on.

    I am sitting now in a place
    where I used to sit
    before Islām.

- id: muzdalifa
  title: Muzdalifa
  date: 2006-01
  text: |-
    The sleep at Muzdalifa
    was among the best
    I have ever known.

    The whole night on my back,
    without waking once.

- id: after-this-journey
  title: After This Journey
  date: 2006-01
  text: |-
    My grandfather has died,
    just after we came home from Hajj.
    It feels so strange,
    after this journey.

    I sit in the leather armchair
    and weep, slowly.

- id: no-christmas
  title: No Christmas
  date: 2005-12
  text: |-
    For the first time as a Muslim
    I do not celebrate Christmas.

    It is hard to say.
    I force it out.

    No big reaction,
    but they want to know why.

    Perhaps it is easier
    to talk about why
    than about feelings.

- id: by-the-sun
  title: By the Sun
  date: 2004-06
  text: |-
    On this trip abroad
    I try to define myself as a Muslim,
    and I struggle with the prayer.

    I am not sure what to do
    about the birdwatching.

    I have a poor grasp
    of the times and the direction.
    I go by the sun.

- id: texts-from-the-internet
  title: Texts from the Internet
  date: 2003-09
  text: |-
    I take the coach to Stockholm
    with a translation of the Qur’ān,
    and barely sleep that night.

    Feeling my way,
    I try to learn to pray
    from texts on the internet.

    What can I eat?

- id: reborn
  title: Reborn
  date: 2003-09
  text: |-
    I feel a great energy in my body.
    Something is about to happen.

    At last I decide,
    there in the hotel room,
    and what rushes through me
    is beyond words.

    Ash-hadu an lā ilāha illallāh,
    wa ash-hadu anna Muḥammadan ‘abduhu wa rasūluh.

    I feel reborn.
